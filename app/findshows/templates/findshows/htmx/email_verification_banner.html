<div class="email-verification-banner banner">
    {% if success %}
        Email sent
    {% else %}
        {% for error in errorlist %}
            <p> {{ error }} </p>
        {% empty %}
            <form type="post">
                {% csrf_token %}
                Please check your email (including spam) for a verification link so you can
                receive the weekly emails or post shows
                (<span class="link"
                      name="resend-verification-email"
                      hx-post="{% url 'resend_email_verification' %}"
                      hx-trigger="click"
                      hx-target="closest .email-verification-banner"
                      hx-swap="outerHTML"
                >resend</span>).
            </form>
        {% endfor %}
    {% endif %}
</div>
